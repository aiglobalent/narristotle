<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Book Was Made for You — The Gift Shelf | Narristotle</title>
<meta name="description" content="Someone made you a book. It lives here, on the Gift Shelf at Narristotle, the bookstore.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=20261022a">
<style>
.gift-wrap{max-width:860px;margin:0 auto;padding:34px 20px 70px}
.gift-eyebrow{text-align:center;color:var(--gold);font-weight:700;letter-spacing:.22em;font-size:12.5px;text-transform:uppercase}
.gift-h1{font-family:"Playfair Display",serif;text-align:center;font-size:clamp(30px,6vw,44px);line-height:1.12;color:var(--navy);margin:12px 0 6px}
.gift-sub{text-align:center;color:#555;font-size:17px;max-width:560px;margin:0 auto}
.gift-media{margin:28px auto 6px;max-width:640px}
.gift-media img{width:100%;border-radius:10px;box-shadow:0 24px 50px rgba(16,44,78,.28)}
.gift-from{background:#FBF8F1;border:1px solid #E7DFC9;border-radius:12px;padding:20px 22px;max-width:640px;margin:22px auto}
.gift-from .who{font-weight:700;color:var(--navy);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.gift-from .msg{font-family:"Playfair Display",serif;font-style:italic;font-size:20px;line-height:1.45;color:#333;margin-top:8px}
.gift-blurb{max-width:640px;margin:18px auto 0;font-size:16.5px;line-height:1.6;color:#3d3d3d}
.gift-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:26px auto 6px;max-width:640px}
.gift-meta{text-align:center;color:#777;font-size:14.5px;margin-top:10px}
.gift-door{max-width:640px;margin:38px auto 0;background:var(--navy);color:#fff;border-radius:14px;padding:26px;text-align:center}
.gift-door h2{font-family:"Playfair Display",serif;font-size:25px;margin:0 0 8px;color:#fff}
.gift-door p{color:#C9D4E4;font-size:15.5px;margin:0 auto 16px;max-width:440px}
.gift-door .btn{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.gift-missing{text-align:center;padding:60px 20px}
.gift-missing h1{font-family:"Playfair Display",serif;color:var(--navy)}
.skel{color:#999;text-align:center;padding:50px 0;font-size:16px}
</style>
</head>
<body>
<header class="site">
  <div class="header-in">
    <a class="brand" href="/" aria-label="Narristotle home">
      <span class="brand-mark">N</span>
      <span class="brand-name">NARRISTOTLE&#8482;<span class="brand-sub">THE GADFLY GAZETTE</span></span>
    </a>
    <button class="nav-toggle" aria-label="Menu" onclick="document.querySelector('nav.main').classList.toggle('open')">&#9776;</button>
    <nav class="main">
      <a href="/start-here">Start Here</a>
      <a href="/gazette">Learn</a>
      <a href="/bookshelf">Bookshelf</a>
      <a href="/play">Play</a>
      <a href="/tools">Tools</a>
      <a href="/about">About</a>
    </nav>
  </div>
</header>

<main class="gift-wrap">
  <div id="giftRoot"><p class="skel">Fetching your book from the shelf&hellip;</p></div>
</main>

<footer class="site">
  <div class="footer-in">
    <p><strong>Narristotle</strong> — the bookstore. Books made with the Method live on
    <a href="/bookshelf">Our Own Shelf</a>; books made as gifts live on the Gift Shelf.</p>
  </div>
</footer>

<script>
(function(){
  var slug = location.pathname.replace(/^\/gift\/?/, '').replace(/\/$/, '');
  var root = document.getElementById('giftRoot');
  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function missing(){
    root.innerHTML = '<div class="gift-missing"><p class="gift-eyebrow">The Gift Shelf</p>' +
      '<h1>That spot on the shelf is empty.</h1>' +
      '<p class="gift-sub">The link may be mistyped, or the book hasn&rsquo;t been shelved yet. ' +
      'If someone sent you a gift card, check the short link on the inside cover.</p>' +
      '<div class="gift-actions"><a class="btn btn-navy" href="/bookshelf">Browse the bookshelf</a></div></div>';
  }
  if(!slug){ missing(); return; }
  fetch('/gift-data/' + encodeURIComponent(slug) + '.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('missing'); return r.json(); })
    .then(function(b){
      document.title = b.title + ' — a gift for ' + (b.recipientName || 'you') + ' | Narristotle';
      var fromBlock = '';
      if(b.fromName || b.message){
        fromBlock = '<div class="gift-from">' +
          (b.fromName ? '<div class="who">A gift from ' + esc(b.fromName) + '</div>' : '') +
          (b.message ? '<div class="msg">&ldquo;' + esc(b.message) + '&rdquo;</div>' : '') + '</div>';
      }
      root.innerHTML =
        '<p class="gift-eyebrow">The Gift Shelf — Narristotle, the bookstore</p>' +
        '<h1 class="gift-h1">' + (b.recipientName ? 'A book was made for ' + esc(b.recipientName) + '.' : 'A book was made for you.') + '</h1>' +
        '<p class="gift-sub"><em>' + esc(b.title) + '</em> by ' + esc(b.author) + ' — written, illustrated, and bound as a gift. It lives on this shelf now. It&rsquo;s yours to read, keep, and pass along.</p>' +
        '<div class="gift-media"><img src="' + esc(b.mockupUrl) + '" alt="' + esc(b.title) + ' — the book, front and back"></div>' +
        fromBlock +
        (b.blurb ? '<p class="gift-blurb">' + esc(b.blurb) + '</p>' : '') +
        '<div class="gift-actions">' +
          '<a class="btn btn-navy" href="' + esc(b.pdfUrl) + '">Read the book &#8594;</a>' +
          '<a class="btn btn-ghost" href="' + esc(b.epubUrl) + '" download>EPUB &middot; Apple Books</a>' +
          (b.kindleUrl ? '<a class="btn btn-ghost" href="' + esc(b.kindleUrl) + '" download>EPUB &middot; Kindle</a>' : '') +
        '</div>' +
        '<p class="gift-meta">' + (b.pages ? b.pages + ' pages · ' : '') + 'Free to read here, forever.</p>' +
        (b.kindleUrl ? '<p class="gift-meta">For Kindle: download the Kindle EPUB, then send it free at <strong>amazon.com/sendtokindle</strong> &mdash; it arrives in your library like any Kindle book.</p>' : '') +
        '<div class="gift-door"><h2>This book was made in minutes.</h2>' +
        '<p>' + esc(b.makerLine || 'Someone told a story about a person they love, and it became this book.') + ' You could make one for someone you love — tonight, from your phone.</p>' +
        '<a class="btn" href="/bookshelf#gift-shelf">See the Gift Shelf</a></div>';
    })
    .catch(missing);
})();
</script>
</body>
</html>
